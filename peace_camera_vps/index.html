<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Memories - Peace Camera</title>
    <link rel="stylesheet" href="static/css/style.css?v=2.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>

        <div id="ui-layer">
            <!-- スタート画面 -->
            <div id="start-screen">
                <div class="glass-panel">
                    <h1>MEMORY CAMERA</h1>
                    <p class="subtitle">Capture Your Special Stay at Our Home</p>
                    <div class="language-selector">
                        <button class="lang-btn active" data-lang="ja">日本語</button>
                        <button class="lang-btn" data-lang="en">English</button>
                        <button class="lang-btn" data-lang="ko">한국어</button>
                        <button class="lang-btn" data-lang="zh">中文</button>
                    </div>
                    <div class="instructions">
                        <div class="inst-item"><span class="icon">📸</span><p id="inst-1"></p></div>
                        <div class="inst-item"><span class="icon">✌️</span><p id="inst-2"></p></div>
                        <div class="inst-item"><span class="icon">📱</span><p id="inst-3"></p></div>
                        <div class="inst-item"><span class="icon">🏠</span><p id="inst-4"></p></div>
                    </div>
                    <button id="start-button">START CAPTURING</button>
                </div>
            </div>

            <div id="status-message" class="hidden"></div>
            <div id="countdown"></div>
            <div id="flash"></div>

            <div id="preview-overlay" class="overlay hidden">
                <div class="preview-container"><img id="preview-image" src=""></div>
                <div class="permission-section">
                    <label class="checkbox-container">
                        <input type="checkbox" id="display-permission" checked>
                        <span class="checkmark"></span>
                        <span id="display-msg"></span>
                    </label>
                </div>
                <div class="btn-group">
                    <button id="retake-button" class="btn-main btn-secondary">RETAKE</button>
                    <button id="upload-button" class="btn-main btn-primary">SAVE</button>
                </div>
            </div>

            <div id="result-overlay" class="overlay hidden">
                <div class="result-container">
                    <img id="captured-image" src="">
                    <div class="qr-card"><canvas id="qr-code"></canvas><p>SCAN!</p></div>
                </div>
                <div class="thank-you"></div>
                <button id="next-button" class="btn-main btn-primary">DONE</button>
            </div>
        </div>
    </div>
    <script type="module" src="static/js/main.js?v=2.1"></script>
</body>
</html>
